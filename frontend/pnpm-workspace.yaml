# Este archivo solo configura este proyecto; no enlaza frontend y backend.
packages:
  - '.'

engineStrict: true
savePrefix: ''
minimumReleaseAge: 1440
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictDepBuilds: true
verifyDepsBeforeRun: error
enablePrePostScripts: false

# Solo se autoriza el script de esbuild, dependencia necesaria de las herramientas de desarrollo.
# Cualquier nuevo script de dependencia seguira bloqueado hasta revision manual.
allowBuilds:
  esbuild: true
